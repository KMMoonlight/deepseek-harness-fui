# Three-platform packaging for the Electron FUI desktop application.

name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: macos
            outputs: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
          - platform: ubuntu-22.04
            artifact: linux
            outputs: apps/desktop/dist/*.AppImage
          - platform: windows-latest
            artifact: windows
            outputs: apps/desktop/dist/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout=900000

      - name: Build and package the desktop application
        run: pnpm run dist:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.outputs }}
          if-no-files-found: error
