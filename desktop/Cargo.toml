[package]
name = "deepseek-fui"
version = "0.1.0"
description = "FUI desktop shell for DeepSeek Harness"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
