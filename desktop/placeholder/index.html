<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek FUI</title>
    <style>
      /* Shown while the harness boots; the shell navigates away once the
         backend announces its URL. Values are inlined rather than pulled from
         the f-ui token sheet because this page must render before any part of
         the application has loaded. */
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: #060c18; color: #a5d3e2;
        font: 12px/1.6 ui-monospace, monospace;
        letter-spacing: 0.2em; text-transform: uppercase;
      }
      .box { border: 1px solid rgba(63,143,196,0.45); padding: 24px 32px; }
      .bar { margin-top: 12px; height: 2px; background: rgba(63,143,196,0.18); overflow: hidden; }
      .bar::after {
        content: ''; display: block; height: 100%; width: 40%;
        background: #2fe0a8; animation: sweep 1.4s ease-in-out infinite;
      }
      @keyframes sweep { 0% { transform: translateX(-100%) } 100% { transform: translateX(350%) } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100% } }
    </style>
  </head>
  <body>
    <div class="box">
      Starting harness
      <div class="bar"></div>
    </div>
  </body>
</html>
