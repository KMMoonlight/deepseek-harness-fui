# The dsh-fui-app bundle patch: the FUI surface over the dsh-web-app layer.
#
# Applied after dsh-base and dsh-web-app, so every row the web surface already
# composed is in place and this layer only restates what the FUI surface
# changes. A patch replaces the targeted row's whole `config`, so any row here
# restates every key it owns.
#
# Deliberately NOT restated here: the webserver, API gateway, transport, and
# frontend-dist rows. This bundle shares the browser application and its dist
# with dsh-web-app — the FUI surface differs by which client plugins the roster
# mounts, not by how the page is served. `dsh web` therefore keeps working
# unchanged beside `dsh --profile fui`, which is what makes an A/B comparison
# of the two surfaces possible during the skin work.

# The FUI surface claim. Mounted only here, which is what keeps the shared
# frontend build from re-skinning `dsh web`: the alias bridge it carries is
# scoped to the document attribute this plugin sets, and the stock surface
# never sets it.
- insert:
    # The update provider owns npm access and managed-runtime commits. Both
    # halves stay absent from an ordinary `dsh --profile fui` browser launch.
    - id: runtime-updater
      name: '@deepseek-ai/dsh-host-runtime-updater'
      disabled: !!js process.env.DSH_DESKTOP !== '1'
      config:
        currentVersion: !!js process.env.DSH_DESKTOP_RUNTIME_VERSION
        currentSource: !!js process.env.DSH_DESKTOP_RUNTIME_SOURCE
        fuiVersion: !!js process.env.DSH_DESKTOP_FUI_VERSION
        compatibleDshRange: !!js process.env.DSH_DESKTOP_DSH_COMPATIBILITY
        overlayRoot: !!js process.env.DSH_DESKTOP_OVERLAY_ROOT
        runtimeRoot: !!js process.env.DSH_DESKTOP_RUNTIME_ROOT
        pnpmEntry: !!js process.env.DSH_PNPM_ENTRY
        registryUrl: 'https://registry.npmjs.org'
        distTag: latest
        checkTimeoutMs: 15000
        installTimeoutMs: 300000
        maxOutputBytes: 64000
        graceMs: 5000

    - id: ui-settings-runtime-updater
      name: '@deepseek-ai/dsh-client-ui-settings-runtime-updater'
      disabled: !!js process.env.DSH_DESKTOP !== '1'

    - id: ui-fui-surface
      name: '@deepseek-ai/dsh-client-ui-fui-surface'

    - id: ui-fui-layout
      name: '@deepseek-ai/dsh-client-ui-fui-layout'

# The stock frame steps aside for the fork above. Both declare the same four
# child slots and the `root` registration is single-kind, so mounting either
# is fine and mounting both fails at load — the disable is what makes the
# swap legal rather than a conflict.
- id: ui-layout
  disabled: true

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      The GUI you are surfaced through uses the FUI visual system: a dark navy ground with thin
      steel-blue rules and teal highlights.
